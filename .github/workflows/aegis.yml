name: Aegis demo review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: aegis-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mhmtemnbgr1/Aegis@main
        with:
          config: .github/aegis.toml
          ollama-host: ${{ secrets.AEGIS_OLLAMA_HOST }}
